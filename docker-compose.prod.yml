version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: rbsl-api:production
    container_name: rbsl_api_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Add other production environment variables here
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # To use RunPod or Akash, these can be mapped to custom resources or deployed using kubernetes/akash SDL
